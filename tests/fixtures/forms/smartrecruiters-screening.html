     (id question_<uuid>, label y campo en su shadow root), las de sí o no como spl-radio-group (el enunciado
     va en el DOM normal, en un span slot="label-content", y no hay inputs nativos) y una sola zona de
     archivos, "Additional attachments", que no es el CV. El contenido es inventado. -->
