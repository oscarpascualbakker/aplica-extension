<!doctype html>
<!-- CV-543: paso "My Information" de un formulario de Workday (/apply/applyManually). La estructura sale de la
     captura real de noviembre de 2026 (data-automation-id en los contenedores, name e id de cada campo,
     desplegables con un input auxiliar anónimo detrás del botón, buscadores multiselect). El contenido es
     inventado. Los otros pasos: workday-experience.html y workday-account.html. -->
<html lang="en-US">
<head>
<meta charset="utf-8"/>
<title>Candidate Home</title>
<meta property="og:title" content="Empresa Ficticia Careers"/>
</head>
<body>
<main>
<h3>My Information</h3>
<div><abbr>*</abbr> Indicates a required field</div>
<div data-automation-id="applyFlowMyInfoPage">
<div role="group" aria-labelledby="source-section">
<div data-fkit-id="source--source" data-automation-id="formField-source">
<label for="source--source"><span>How Did You Hear About Us?<abbr aria-hidden="true">*</abbr></span></label>
<div data-automation-id="multiSelectContainer" data-uxi-widget-type="multiselect">
<div data-automation-id="multiselectInputContainer">
<div data-automation-hiddensearch="false"><input id="source--source" enterkeyhint="search" placeholder="Search" aria-required="true" autocomplete="off" data-uxi-widget-type="selectinput" value=""/><div data-automation-id="promptSelectionLabel"></div><div aria-hidden="true" data-automation-id="promptAriaInstruction">0 items selected</div></div>
</div>
</div>
</div>
</div>
<div role="group" aria-labelledby="previousWorker-section">
<div data-fkit-id="previousWorker--candidateIsPreviousWorker" data-automation-id="formField-candidateIsPreviousWorker">
<fieldset><legend><label id="radio-label1"><span>Have you previously worked for this organization? If Yes, please answer the question below. If No, please continue to the next page.<abbr aria-hidden="true">*</abbr></span></label></legend>
<div name="candidateIsPreviousWorker" aria-labelledby="radio-label1" id="previousWorker--candidateIsPreviousWorker" aria-required="true">
<div><input id="vvov7" name="candidateIsPreviousWorker" type="radio" aria-checked="false" value="true"/><label for="vvov7">Yes</label></div>
<div><input id="vvov8" name="candidateIsPreviousWorker" type="radio" aria-checked="false" value="false"/><label for="vvov8">No</label></div>
</div>
</fieldset>
</div>
</div>
<div role="group" aria-labelledby="country-section">
<div data-fkit-id="country--country" data-automation-id="formField-country">
<label for="country--country"><span>Country<abbr aria-hidden="true">*</abbr></span></label>
<div><button aria-haspopup="listbox" type="button" value="a1b2c3" aria-label="Country Spain Required" name="country" id="country--country">Spain</button><input type="text" value="a1b2c3"/></div>
</div>
</div>
<div role="group" aria-labelledby="Legal-Name-section">
<h4 id="Legal-Name-section">Legal Name</h4>
<div data-fkit-id="name--legalName--firstName" data-automation-id="formField-legalName--firstName">
<label for="name--legalName--firstName"><span>Given Name(s)<abbr aria-hidden="true">*</abbr></span></label>
<div><input type="text" id="name--legalName--firstName" name="legalName--firstName" aria-required="true" value=""/></div>
</div>
<div data-fkit-id="name--legalName--lastName" data-automation-id="formField-legalName--lastName">
<label for="name--legalName--lastName"><span>First Last Name<abbr aria-hidden="true">*</abbr></span></label>
<div><input type="text" id="name--legalName--lastName" name="legalName--lastName" aria-required="true" value=""/></div>
</div>
<div data-fkit-id="name--legalName--secondaryLastName" data-automation-id="formField-legalName--secondaryLastName">
<label for="name--legalName--secondaryLastName">Second Last Name</label>
<div><input type="text" id="name--legalName--secondaryLastName" name="legalName--secondaryLastName" aria-required="false" value=""/></div>
</div>
<div data-fkit-id="name--preferredCheck" data-automation-id="formField-preferredCheck">
<label for="name--preferredCheck">I have a preferred name</label>
<input id="name--preferredCheck" type="checkbox" aria-checked="false" name="preferredCheck" aria-required="false"/>
</div>
</div>
<div role="group" aria-labelledby="Address-section">
<h4 id="Address-section">Address</h4>
<div data-fkit-id="address--addressLine1" data-automation-id="formField-addressLine1">
<label for="address--addressLine1"><span>Name of Street<abbr aria-hidden="true">*</abbr></span></label>
<div><input type="text" id="address--addressLine1" name="addressLine1" aria-required="true" value=""/></div>
</div>
<div data-fkit-id="address--postalCode" data-automation-id="formField-postalCode">
<label for="address--postalCode"><span>Postal Code<abbr aria-hidden="true">*</abbr></span></label>
<div><input type="text" id="address--postalCode" name="postalCode" aria-required="true" value=""/></div>
</div>
<div data-fkit-id="address--city" data-automation-id="formField-city">
<label for="address--city"><span>City<abbr aria-hidden="true">*</abbr></span></label>
<div><input type="text" id="address--city" name="city" aria-required="true" value=""/></div>
</div>
<div data-fkit-id="address--countryRegion" data-automation-id="formField-countryRegion">
<label for="address--countryRegion"><span>Province<abbr aria-hidden="true">*</abbr></span></label>
<div><button aria-haspopup="listbox" type="button" value="" aria-label="Province Select One Required" name="countryRegion" id="address--countryRegion">Select One</button><input type="text" value=""/></div>
</div>
</div>
<div role="group" aria-labelledby="Email-Address-section">
<h4 id="Email-Address-section">Email Address</h4>
<div><span id="emailAddress">ana@example.com</span></div>
</div>
<div role="group" aria-labelledby="Phone-section">
<h4 id="Phone-section">Phone</h4>
<div data-fkit-id="phoneNumber--phoneType" data-automation-id="formField-phoneType">
<label for="phoneNumber--phoneType"><span>Phone Device Type<abbr aria-hidden="true">*</abbr></span></label>
<div><button aria-haspopup="listbox" type="button" value="" aria-label="Phone Device Type Select One Required" name="phoneType" id="phoneNumber--phoneType">Select One</button><input type="text" value=""/></div>
</div>
<div data-fkit-id="phoneNumber--countryPhoneCode" data-automation-id="formField-countryPhoneCode">
<label for="phoneNumber--countryPhoneCode"><span>Country Phone Code<abbr aria-hidden="true">*</abbr></span></label>
<div data-automation-id="multiSelectContainer" data-uxi-widget-type="multiselect">
<div data-automation-id="multiselectInputContainer">
<div data-automation-hiddensearch="false"><input id="phoneNumber--countryPhoneCode" enterkeyhint="search" placeholder="Search" aria-required="true" autocomplete="off" data-uxi-widget-type="selectinput" value=""/><div data-automation-id="promptSelectionLabel"></div><div aria-hidden="true" data-automation-id="promptAriaInstruction">1 item selected, Spain (+34)</div></div>
<ul role="listbox" data-automation-id="selectedItemList" aria-label="items selected"><li role="presentation" data-automation-id="menuItem"><div role="option" aria-label="Spain (+34), press delete to clear value." data-automation-id="selectedItem"><p data-automation-id="promptOption" data-automation-label="Spain (+34)">Spain (+34)</p></div></li></ul>
</div>
</div>
</div>
<div data-fkit-id="phoneNumber--phoneNumber" data-automation-id="formField-phoneNumber">
<label for="phoneNumber--phoneNumber"><span>Phone Number<abbr aria-hidden="true">*</abbr></span></label>
<div><input type="text" id="phoneNumber--phoneNumber" name="phoneNumber" aria-required="true" value=""/></div>
</div>
<div data-fkit-id="phoneNumber--extension" data-automation-id="formField-extension">
<label for="phoneNumber--extension">Phone Extension</label>
<div><input type="text" id="phoneNumber--extension" name="extension" aria-required="false" value=""/></div>
</div>
<div><input id="vvov6" type="checkbox" aria-checked="false" data-automation-id="phone-sms-opt-in"/><a data-automation-id="phone-terms-and-condition-link" href="#">Terms and Conditions</a></div>
</div>
</div>
<div data-automation-id="pageFooter"><button data-automation-id="pageFooterBackButton" type="button">Back</button><button data-automation-id="pageFooterNextButton">Save and Continue</button></div>
</main>
</body>
</html>
