<!doctype html>
<!-- CV-543: formulario de candidatura de Personio (/job/<id>/apply), en español como en la captura real de
     noviembre de 2026: ids field-<nombre> y name first_name, last_name, email, phone, available_from y
     salary_expectations; dos campos de archivo, el CV (name="documents.cv") y "Otro" (name="documents.other"),
     y un botón de enviar. No hay campos de ciudad, LinkedIn ni web, ni preguntas propias de la empresa. El
     contenido es inventado. -->
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Desarrolladora backend - Empresa Ficticia S.L.</title>
</head>
<body>
<main>
<h1>Desarrolladora backend</h1>
<form>
<fieldset>
<div role="group" aria-labelledby="name-group-label"><span id="name-group-label">Name<span aria-hidden="true">*</span><span> (obligatorio)</span></span>
<div><label for="field-first_name">Nombre</label><input id="field-first_name" type="text" maxlength="255" placeholder="Nombre" name="first_name" value=""/></div>
<div><label for="field-last_name">Apellido</label><input id="field-last_name" type="text" maxlength="255" placeholder="Apellido" name="last_name" value=""/></div>
</div>
<div><label for="field-email">Correo electrónico<span aria-hidden="true">*</span><span> (obligatorio)</span></label><input id="field-email" type="email" maxlength="255" placeholder="yourmail@domain.com" name="email" value=""/></div>
<div><label for="field-phone">Teléfono<span aria-hidden="true">*</span><span> (obligatorio)</span></label><input id="field-phone" type="text" maxlength="255" placeholder="+49 176 123 4455" name="phone" value=""/></div>
<div><label for="field-available_from">Disponible desde<span aria-hidden="true">*</span><span> (obligatorio)</span></label><input id="field-available_from" type="text" maxlength="255" placeholder="Disponible desde" name="available_from" value=""/></div>
<div><label for="field-salary_expectations">Expectativas salariales<span aria-hidden="true">*</span><span> (obligatorio)</span></label><input id="field-salary_expectations" type="text" maxlength="255" placeholder="Expectativas salariales" name="salary_expectations" value=""/></div>
<h3>Documentos</h3>
<div>Por favor, sube tu currículum, certificados actuales (máx. 20 MB en total).</div>
<div role="group" aria-labelledby="doc-label-cv">
<div id="doc-label-cv">CV<span aria-hidden="true">*</span><span> (obligatorio)</span></div>
<button type="button">Añadir archivo</button>
<input id="doc-input-cv" type="file" multiple="" accept=".pdf,.docx,.doc,.png,.jpg,.jpeg,.txt,.odt,.ods,.xlsx,.rtf" aria-label="Upload CV" name="documents.cv"/>
</div>
<div role="group" aria-labelledby="doc-label-other">
<div id="doc-label-other">Otro<span> (Opcional)</span></div>
<button type="button">Añadir archivo</button>
<input id="doc-input-other" type="file" multiple="" accept=".pdf,.docx,.doc,.png,.jpg,.jpeg,.txt,.odt,.ods,.xlsx,.rtf" aria-label="Upload Otro" name="documents.other"/>
</div>
<button type="submit">Enviar candidatura</button>
</fieldset>
</form>
</main>
</body>
</html>
