<!doctype html>

     provisional hasta capturar la página real. -->
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta property="og:site_name" content="Empresa Ficticia S.L."/>
<title>Careers</title>
</head>
<body>

<h2>Solicitud enviada</h2>

<button type="button" data-automation-id="viewMyApplications">Ver mis candidaturas</button>
</div>
</div>

</html>
